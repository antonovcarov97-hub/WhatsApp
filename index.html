<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Old WhatsApp Messenger</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2/dist/browser-image-compression.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@openlee/gif-maker@1.0.1/dist/index.umd.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1/dist/cropper.min.css">
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1/dist/cropper.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #ece5dd; height: 100vh; overflow: hidden; }

    #auth-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: #075e54; }
    .auth-box { background: white; padding: 30px; border-radius: 8px; width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .auth-box h2 { color: #075e54; text-align: center; margin-bottom: 10px; }
    .auth-box input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .auth-box button { padding: 10px; background: #25d366; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .auth-box button:hover { background: #1ebe5a; }
    .auth-box .hint { font-size: 11px; color: #888; text-align: center; }

    #app-screen { display: none; height: 100vh; }
    .app-container { display: flex; height: 100%; }

    .sidebar { width: 30%; min-width: 260px; background: white; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
    .sidebar-header { padding: 12px; background: #075e54; color: white; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header .user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .sidebar-header .user-info img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #ccc; }
    .sidebar-header .avatar-placeholder { width: 32px; height: 32px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .sidebar-actions button { background: none; border: 1px solid white; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 4px; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .chat-item:hover { background: #f5f5f5; }
    .chat-item.active { background: #e9edef; }
    .chat-item .avatar { width: 40px; height: 40px; border-radius: 50%; background: #25d366; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
    .chat-item .info { flex: 1; overflow: hidden; }
    .chat-item .name { font-weight: 600; font-size: 15px; }
    .chat-item .last-msg { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chat-window { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
    .chat-header { padding: 10px 16px; background: #075e54; color: white; display: flex; align-items: center; gap: 10px; }
    .chat-header .chat-title { font-weight: 600; flex: 1; }
    .chat-header button { background: none; border: 1px solid white; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .message { max-width: 70%; padding: 8px 12px; border-radius: 8px; background: white; font-size: 14px; word-wrap: break-word; }
    .message.mine { align-self: flex-end; background: #dcf8c6; }
    .message .sender { font-size: 11px; color: #075e54; font-weight: 600; margin-bottom: 2px; }
    .message img, .message video { max-width: 100%; border-radius: 4px; margin-top: 4px; display: block; }
    .message .time { font-size: 10px; color: #888; text-align: right; margin-top: 4px; }

    .input-area { padding: 10px; background: #f0f0f0; display: flex; gap: 8px; align-items: center; }
    .input-area input[type="text"] { flex: 1; padding: 10px; border: none; border-radius: 20px; outline: none; }
    .input-area button { width: 40px; height: 40px; border-radius: 50%; border: none; background: #25d366; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .input-area button:hover { background: #1ebe5a; }
    .input-area .file-btn { background: #666; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%; }
    .modal h3 { margin-bottom: 15px; color: #075e54; }
    .modal input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
    .modal button { padding: 10px 20px; background: #25d366; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px; }
    .modal .cancel-btn { background: #999; }
    .modal .member-list { max-height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 8px; margin-bottom: 10px; }
    .modal .member-item { padding: 6px; display: flex; align-items: center; gap: 8px; }
    .modal .member-item input { width: auto; }
    .cropper-container { max-height: 400px; }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <h2>Old WhatsApp</h2>
    <input id="auth-name" type="text" placeholder="Имя (латиница)" autocomplete="username">
    <input id="auth-password" type="password" placeholder="Пароль" autocomplete="current-password">
    <button onclick="handleSignIn()">Войти</button>
    <button onclick="handleSignUp()" style="background:#075e54;">Регистрация</button>
    <p id="auth-msg" style="color:red; font-size:12px; text-align:center; min-height:16px;"></p>
    <p class="hint">Имя: 3-32 символа, латиница, цифры, _ и -</p>
  </div>
</div>

<div id="app-screen">
  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="user-info" onclick="openAvatarModal()">
          <span id="my-avatar-container"><div class="avatar-placeholder" id="my-avatar-placeholder">?</div></span>
          <span id="my-username">Пользователь</span>
        </div>
        <div class="sidebar-actions">
          <button onclick="openCreateGroupModal()">+ Группа</button>
          <button onclick="openStartChatModal()">+ Чат</button>
          <button onclick="handleLogout()">Выйти</button>
        </div>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </div>

    <div class="chat-window">
      <div class="chat-header">
        <span class="chat-title" id="current-chat-title">Выберите чат</span>
        <button id="gif-btn-header" style="display:none;" onclick="openGifModal()">Сделать GIF</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-area" id="input-area" style="display:none;">
        <button class="file-btn" onclick="document.getElementById('file-input').click()">📎</button>
        <input type="file" id="file-input" accept="image/*,video/*" style="display:none;" onchange="handleFileSelect(event)">
        <input type="text" id="message-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="avatar-modal">
  <div class="modal">
    <h3>Аватарка</h3>
    <input type="file" id="avatar-file" accept="image/*" onchange="previewAvatar(event)">
    <div class="cropper-container" id="cropper-container" style="display:none;">
      <img id="avatar-preview" style="max-width:100%;">
    </div>
    <div style="margin-top:10px;">
      <button onclick="saveAvatar()">Сохранить</button>
      <button class="cancel-btn" onclick="closeModal('avatar-modal')">Отмена</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="group-modal">
  <div class="modal">
    <h3>Создать группу</h3>
    <input type="text" id="group-name" placeholder="Название группы">
    <div class="member-list" id="member-list"></div>
    <button onclick="createGroup()">Создать</button>
    <button class="cancel-btn" onclick="closeModal('group-modal')">Отмена</button>
  </div>
</div>

<div class="modal-overlay" id="start-chat-modal">
  <div class="modal">
    <h3>Новый личный чат</h3>
    <div class="member-list" id="start-chat-list"></div>
    <button class="cancel-btn" onclick="closeModal('start-chat-modal')">Отмена</button>
  </div>
</div>

<div class="modal-overlay" id="gif-modal">
  <div class="modal">
    <h3>Создать GIF из видео</h3>
    <input type="file" id="gif-file" accept="video/*" onchange="previewGifVideo(event)">
    <video id="gif-video-preview" style="max-width:100%; display:none; margin-top:10px;" controls></video>
    <div id="gif-loading" style="display:none; margin-top:10px; color:#9c27b0;">Обработка GIF...</div>
    <div style="margin-top:10px;">
      <button onclick="makeGif()" id="gif-make-btn" style="display:none;">Сделать GIF (3 сек)</button>
      <button class="cancel-btn" onclick="closeModal('gif-modal')">Отмена</button>
    </div>
  </div>
</div>

<script>
// ==================== КОНФИГ ====================
const SUPABASE_URL = 'https://ejqmqetysxfutjftxtdf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UX8n70aWWqQVgu1jKhAxcg_vpkBkWV6';
const FAKE_EMAIL_DOMAIN = 'local.app';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ==================== СОСТОЯНИЕ ====================
let currentUser = null;
let currentChatId = null;
let cropper = null;
let allUsers = [];
let messageSubscription = null;
let gifVideoFile = null;

// ==================== AUTH ====================
function nameToEmail(name) {
  return `${name.trim().toLowerCase()}@${FAKE_EMAIL_DOMAIN}`;
}

function validateName(name) {
  return /^[a-zA-Z0-9_-]{3,32}$/.test(name);
}

async function handleSignUp() {
  const name = document.getElementById('auth-name').value.trim();
  const password = document.getElementById('auth-password').value;
  const msg = document.getElementById('auth-msg');

  if (!validateName(name)) {
    msg.style.color = 'red';
    msg.textContent = 'Имя: 3-32 символа, латиница, цифры, _ и -';
    return;
  }
  if (password.length < 6) {
    msg.style.color = 'red';
    msg.textContent = 'Пароль минимум 6 символов';
    return;
  }

  const { error } = await supabase.auth.signUp({
    email: nameToEmail(name),
    password,
    options: { data: { username: name } }
  });

  if (error) {
    msg.style.color = 'red';
    msg.textContent = error.message;
  } else {
    msg.style.color = 'green';
    msg.textContent = 'Аккаунт создан! Входим...';
    await handleSignIn();
  }
}

async function handleSignIn() {
  const name = document.getElementById('auth-name').value.trim();
  const password = document.getElementById('auth-password').value;
  const msg = document.getElementById('auth-msg');

  if (!name || !password) {
    msg.style.color = 'red';
    msg.textContent = 'Введите имя и пароль';
    return;
  }

  const { error } = await supabase.auth.signInWithPassword({
    email: nameToEmail(name),
    password
  });

  if (error) {
    msg.style.color = 'red';
    msg.textContent = error.message === 'Invalid login credentials'
      ? 'Неверное имя или пароль'
      : error.message;
  }
}

async function handleLogout() {
  await supabase.auth.signOut();
  location.reload();
}

supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) initApp(session.user);
});

supabase.auth.onAuthStateChange((_event, session) => {
  if (session) initApp(session.user);
});

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
async function initApp(user) {
  currentUser = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';

  await ensureProfile();

  const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
  if (profile) {
    document.getElementById('my-username').textContent = profile.username || 'Пользователь';
    if (profile.avatar_url) {
      document.getElementById('my-avatar-container').innerHTML =
        `<img src="${profile.avatar_url}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">`;
    } else {
      document.getElementById('my-avatar-placeholder').textContent =
        (profile.username || '?').charAt(0).toUpperCase();
    }
  }

  await loadChats();
  await loadAllUsers();
}

async function ensureProfile() {
  const { data: existing } = await supabase.from('profiles').select('id').eq('id', currentUser.id).maybeSingle();
  if (!existing) {
    const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
    await supabase.from('profiles').insert({ id: currentUser.id, username });
  }
}

async function loadAllUsers() {
  const { data } = await supabase.from('profiles').select('*').neq('id', currentUser.id);
  allUsers = data || [];
}

// ==================== ЧАТЫ ====================
async function loadChats() {
  const { data: memberships } = await supabase
    .from('chat_members')
    .select('chat_id, chats(id, name, is_group)')
    .eq('user_id', currentUser.id);

  const chatListEl = document.getElementById('chat-list');
  chatListEl.innerHTML = '';

  if (!memberships || memberships.length === 0) {
    chatListEl.innerHTML = '<div style="padding:20px;color:#888;text-align:center;">Нет чатов.<br>Создайте группу или личный чат.</div>';
    return;
  }

  const personalChatIds = memberships.filter(m => m.chats && !m.chats.is_group).map(m => m.chat_id);
  let personalNames = {};
  if (personalChatIds.length > 0) {
    const { data: members } = await supabase
      .from('chat_members')
      .select('chat_id, profiles(username)')
      .in('chat_id', personalChatIds)
      .neq('user_id', currentUser.id);
    (members || []).forEach(m => {
      personalNames[m.chat_id] = m.profiles?.username || 'Собеседник';
    });
  }

  for (const m of memberships) {
    const chat = m.chats;
    if (!chat) continue;
    const displayName = chat.is_group
      ? (chat.name || 'Группа')
      : (personalNames[chat.id] || 'Личный чат');

    const div = document.createElement('div');
    div.className = 'chat-item';
    div.dataset.chatId = chat.id;
    div.onclick = () => openChat(chat.id, displayName);
    div.innerHTML = `
      <div class="avatar">${escapeHtml(displayName.charAt(0).toUpperCase())}</div>
      <div class="info">
        <div class="name">${escapeHtml(displayName)}</div>
        <div class="last-msg">${chat.is_group ? '👥 Группа' : '💬 Личный чат'}</div>
      </div>
    `;
    chatListEl.appendChild(div);
  }
}

async function openChat(chatId, title) {
  currentChatId = chatId;
  document.getElementById('current-chat-title').textContent = title;
  document.getElementById('input-area').style.display = 'flex';
  document.getElementById('gif-btn-header').style.display = 'block';

  document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.chat-item[data-chat-id="${chatId}"]`)?.classList.add('active');

  await loadMessages(chatId);
  subscribeToMessages(chatId);
}

// ==================== СООБЩЕНИЯ ====================
async function loadMessages(chatId) {
  const { data } = await supabase
    .from('messages')
    .select('*, profiles(username)')
    .eq('chat_id', chatId)
    .order('created_at', { ascending: true });

  const container = document.getElementById('messages');
  container.innerHTML = '';
  if (data) data.forEach(msg => renderMessage(msg));
  container.scrollTop = container.scrollHeight;
}

function renderMessage(msg) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message' + (msg.sender_id === currentUser.id ? ' mine' : '');

  const senderName = msg.profiles?.username || 'Аноним';
  const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  let contentHtml = '';
  if (msg.media_type === 'image' || msg.media_type === 'gif') {
    contentHtml = `<img src="${msg.content}" loading="lazy">`;
  } else if (msg.media_type === 'video') {
    contentHtml = `<video src="${msg.content}" controls></video>`;
  } else {
    contentHtml = `<span>${escapeHtml(msg.content)}</span>`;
  }

  div.innerHTML = `
    <div class="sender">${escapeHtml(senderName)}</div>
    ${contentHtml}
    <div class="time">${time}</div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function subscribeToMessages(chatId) {
  if (messageSubscription) supabase.removeChannel(messageSubscription);
  messageSubscription = supabase
    .channel(`messages-chat-${chatId}`)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'messages',
      filter: `chat_id=eq.${chatId}`
    }, async (payload) => {
      const { data: profile } = await supabase.from('profiles').select('username').eq('id', payload.new.sender_id).single();
      payload.new.profiles = profile;
      renderMessage(payload.new);
    })
    .subscribe();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text ?? '';
  return div.innerHTML;
}

// ==================== ТЕКСТ ====================
async function sendMessage() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text || !currentChatId) return;
  input.value = '';
  const { error } = await supabase.from('messages').insert({
    chat_id: currentChatId,
    sender_id: currentUser.id,
    content: text,
    media_type: 'text'
  });
  if (error) alert('Ошибка: ' + error.message);
}

// ==================== ФАЙЛЫ ====================
async function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file || !currentChatId) return;
  event.target.value = '';

  const isImage = file.type.startsWith('image/');
  const isVideo = file.type.startsWith('video/');

  try {
    let uploadBlob = file;
    let mediaType = 'video';
    let ext = file.name.split('.').pop() || 'bin';

    if (isImage) {
      uploadBlob = await imageCompression(file, { maxSizeMB: 0.5, maxWidthOrHeight: 1280, useWebWorker: true });
      mediaType = 'image';
      ext = 'jpg';
    } else if (isVideo) {
      mediaType = 'video';
      ext = 'mp4';
    } else {
      alert('Только фото и видео');
      return;
    }

    const fileName = `${currentUser.id}/${Date.now()}.${ext}`;
    const { error: uploadError } = await supabase.storage
      .from('chat-media')
      .upload(fileName, uploadBlob, { contentType: uploadBlob.type || (isImage ? 'image/jpeg' : 'video/mp4') });
    if (uploadError) throw uploadError;

    const { data: { publicUrl } } = supabase.storage.from('chat-media').getPublicUrl(fileName);
    const { error: msgError } = await supabase.from('messages').insert({
      chat_id: currentChatId,
      sender_id: currentUser.id,
      content: publicUrl,
      media_type: mediaType
    });
    if (msgError) throw msgError;
  } catch (err) {
    alert('Ошибка загрузки: ' + err.message);
  }
}

// ==================== GIF ====================
function openGifModal() {
  gifVideoFile = null;
  document.getElementById('gif-file').value = '';
  document.getElementById('gif-video-preview').style.display = 'none';
  document.getElementById('gif-make-btn').style.display = 'none';
  document.getElementById('gif-loading').style.display = 'none';
  document.getElementById('gif-modal').classList.add('active');
}

function previewGifVideo(event) {
  const file = event.target.files[0];
  if (!file) return;
  gifVideoFile = file;
  const v = document.getElementById('gif-video-preview');
  v.src = URL.createObjectURL(file);
  v.style.display = 'block';
  document.getElementById('gif-make-btn').style.display = 'inline-block';
}

async function makeGif() {
  if (!gifVideoFile || !currentChatId) return;
  const loading = document.getElementById('gif-loading');
  const makeBtn = document.getElementById('gif-make-btn');
  loading.style.display = 'block';
  makeBtn.disabled = true;

  try {
    if (!window.toGif) throw new Error('GIF библиотека не загрузилась');
    const gifBlob = await window.toGif(gifVideoFile, {
      startTime: 0, duration: 3, fps: 10, width: 320, quality: 'medium'
    });

    const fileName = `${currentUser.id}/${Date.now()}.gif`;
    const { error: uploadError } = await supabase.storage
      .from('chat-media')
      .upload(fileName, gifBlob, { contentType: 'image/gif' });
    if (uploadError) throw uploadError;

    const { data: { publicUrl } } = supabase.storage.from('chat-media').getPublicUrl(fileName);
    const { error: msgError } = await supabase.from('messages').insert({
      chat_id: currentChatId,
      sender_id: currentUser.id,
      content: publicUrl,
      media_type: 'gif'
    });
    if (msgError) throw msgError;

    closeModal('gif-modal');
  } catch (err) {
    alert('Ошибка GIF: ' + err.message);
  } finally {
    loading.style.display = 'none';
    makeBtn.disabled = false;
  }
}

// ==================== АВАТАРКА ====================
function openAvatarModal() {
  document.getElementById('avatar-modal').classList.add('active');
}

function previewAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  const img = document.getElementById('avatar-preview');
  img.src = URL.createObjectURL(file);
  document.getElementById('cropper-container').style.display = 'block';
  if (cropper) cropper.destroy();
  cropper = new Cropper(img, { aspectRatio: 1, viewMode: 1, autoCropArea: 0.8 });
}

async function saveAvatar() {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ width: 200, height: 200 });
  canvas.toBlob(async (blob) => {
    try {
      const fileName = `${currentUser.id}/avatar.jpg`;
      const { error } = await supabase.storage
        .from('avatars')
        .upload(fileName, blob, { upsert: true, contentType: 'image/jpeg' });
      if (error) throw error;

      const { data: { publicUrl } } = supabase.storage.from('avatars').getPublicUrl(fileName);
      const urlWithTs = publicUrl + '?t=' + Date.now();

      await supabase.from('profiles').update({ avatar_url: urlWithTs }).eq('id', currentUser.id);
      document.getElementById('my-avatar-container').innerHTML =
        `<img src="${urlWithTs}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">`;
      closeModal('avatar-modal');
      cropper.destroy();
      cropper = null;
    } catch (err) {
      alert('Ошибка: ' + err.message);
    }
  }, 'image/jpeg', 0.85);
}

// ==================== ГРУППЫ ====================
function openCreateGroupModal() {
  document.getElementById('group-modal').classList.add('active');
  const list = document.getElementById('member-list');
  if (allUsers.length === 0) {
    list.innerHTML = '<div style="padding:8px;color:#888;">Других пользователей нет</div>';
    return;
  }
  list.innerHTML = allUsers.map(u => `
    <div class="member-item">
      <input type="checkbox" value="${u.id}" id="member-${u.id}">
      <label for="member-${u.id}">${escapeHtml(u.username || u.id)}</label>
    </div>
  `).join('');
}

async function createGroup() {
  const name = document.getElementById('group-name').value.trim();
  if (!name) { alert('Введите название'); return; }

  const selected = Array.from(document.querySelectorAll('#member-list input:checked')).map(cb => cb.value);
  const { data: chat, error: chatError } = await supabase
    .from('chats').insert({ name, is_group: true }).select().single();
  if (chatError) { alert('Ошибка: ' + chatError.message); return; }

  const members = [currentUser.id, ...selected].map(uid => ({ chat_id: chat.id, user_id: uid }));
  const { error: memberError } = await supabase.from('chat_members').insert(members);
  if (memberError) { alert('Ошибка участников: ' + memberError.message); return; }

  closeModal('group-modal');
  document.getElementById('group-name').value = '';
  await loadChats();
}

// ==================== ЛИЧНЫЙ ЧАТ ====================
function openStartChatModal() {
  document.getElementById('start-chat-modal').classList.add('active');
  const list = document.getElementById('start-chat-list');
  if (allUsers.length === 0) {
    list.innerHTML = '<div style="padding:8px;color:#888;">Других пользователей нет</div>';
    return;
  }
  list.innerHTML = allUsers.map(u => `
    <div class="member-item" style="cursor:pointer;" onclick="startPersonalChat('${u.id}', '${escapeHtml(u.username || '')}')">
      <span style="width:28px;height:28px;border-radius:50%;background:#25d366;color:white;display:inline-flex;align-items:center;justify-content:center;font-size:12px;">${escapeHtml((u.username || '?').charAt(0).toUpperCase())}</span>
      <span>${escapeHtml(u.username || u.id)}</span>
    </div>
  `).join('');
}

async function startPersonalChat(otherUserId, otherName) {
  closeModal('start-chat-modal');

  const { data: myChats } = await supabase
    .from('chat_members')
    .select('chat_id, chats!inner(is_group)')
    .eq('user_id', currentUser.id)
    .eq('chats.is_group', false);

  const myPersonalIds = (myChats || []).map(m => m.chat_id);
  if (myPersonalIds.length > 0) {
    const { data: otherMembership } = await supabase
      .from('chat_members')
      .select('chat_id')
      .eq('user_id', otherUserId)
      .in('chat_id', myPersonalIds);
    if (otherMembership && otherMembership.length > 0) {
      await loadChats();
      openChat(otherMembership[0].chat_id, otherName);
      return;
    }
  }

  const { data: chat, error } = await supabase
    .from('chats').insert({ name: null, is_group: false }).select().single();
  if (error) { alert('Ошибка: ' + error.message); return; }

  await supabase.from('chat_members').insert([
    { chat_id: chat.id, user_id: currentUser.id },
    { chat_id: chat.id, user_id: otherUserId }
  ]);

  await loadChats();
  openChat(chat.id, otherName);
}

// ==================== УТИЛИТЫ ====================
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('active');
  });
});
</script>
